<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Bookshelf{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-page="{% block page_id %}{% endblock %}">

  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">Bookshelf</span>
      </div>

      <nav class="nav">
        <a class="nav-link" href="/" data-nav="home">Overview</a>
        <a class="nav-link" href="/authors" data-nav="authors">Authors</a>
        <a class="nav-link" href="/books" data-nav="books">Books</a>
      </nav>

      <p class="sidebar-note">A small library you manage through your own API.</p>
    </aside>

    <main class="main">
      <div id="flash" class="flash" hidden></div>
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
